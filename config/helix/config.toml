theme = "catppuccin_macchiato"

[editor]
bufferline = "always"
end-of-line-diagnostics = "hint"
mouse = true

[editor.inline-diagnostics]
cursor-line = "warning"

[editor.cursor-shape]
insert = "bar"
normal = "block"

[editor.file-picker]
hidden = true

[editor.indent-guides]
render = true

[keys.normal]
C-s = ":w"

[keys.normal.space]
g = "global_search"
"/" = "changed_file_picker"
o = ":buffer-close-others"
