general {
    gaps_in = 3
    gaps_out = 3
    border_size = 2
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
    col.active_border = 0xFFEEEEEE
    col.inactive_border = rgba(595959aa)
}

decoration {
    rounding = 10
    rounding_power = 2
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 15
        passes = 2
        ignore_opacity = true
        noise = 0.08
        contrast = 1.5
        brightness = 0.8
        vibrancy = 0.1696
    }
}

animations {
    enabled = yes

    bezier = ease-out-expo, 0.16, 1.0, 0.3, 1.0

    animation = layers, 0
    animation = border, 0
    animation = fade, 1, 3, ease-out-expo

    animation = workspaces, 1, 3, ease-out-expo, slide
    animation = windows, 1, 2.2, ease-out-expo, popin 20%
}

dwindle {
    pseudotile = true
    preserve_split = true
}

scrolling {
    fullscreen_on_one_column = false
    explicit_column_widths = 0.333, 0.5, 0.667, 1.0
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = false
    enable_anr_dialog = true
    on_focus_under_fullscreen = 1
    middle_click_paste = false
}

